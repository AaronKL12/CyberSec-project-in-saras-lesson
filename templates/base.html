<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Oakwood Life Center{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Oakwood Life Center</a>
    {% if current_user.is_authenticated %}
    <nav class="nav-links"><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('profile') }}">Profile</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="text-button" type="submit">Sign out</button></form></nav>
    {% endif %}
</header>
<main class="shell">
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}<div class="notice {{ category }}">{{ message }}</div>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</main>
</body>
</html>
